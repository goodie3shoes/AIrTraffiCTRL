<text x="1377.4285714285716" y="170" font-size="17" fill="#f472b6" font-weight="700" text-anchor="middle">7</text>
<text x="1365.4285714285716" y="216" font-size="21" fill="#e5ebf3" font-weight="600" text-anchor="start">Record</text>
<text x="1365.4285714285716" y="250.0" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">Packet filed.</text>
<text x="1365.4285714285716" y="269.575" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">Board updated.</text>
<text x="1365.4285714285716" y="289.15" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">Origin tagged.</text>
<rect x="60" y="420" width="720" height="190" rx="12" fill="#13171f" stroke="#263042" stroke-width="1.5"/>
<text x="86" y="452" font-size="13" fill="#38bdf8" font-weight="700" text-anchor="start" letter-spacing="2.5">ROUTING: THINK BIG, WORK SMALL</text>
<rect x="86" y="496" width="206" height="64" rx="12" fill="#171c26" stroke="#263042" stroke-width="1.5"/>
<text x="100" y="522" font-size="16.5" fill="#e5ebf3" font-weight="600" text-anchor="start">Small model</text>
<text x="100" y="543" font-size="13" fill="#97a8bd" font-weight="400" text-anchor="start">routine work first</text>
<line x1="294" y1="520" x2="310" y2="500" stroke="#97a8bd" stroke-width="2" marker-end="url(#a)"/>
<rect x="312" y="468" width="206" height="64" rx="12" fill="#171c26" stroke="#263042" stroke-width="1.5"/>
<text x="326" y="494" font-size="16.5" fill="#e5ebf3" font-weight="600" text-anchor="start">Mid model</text>
<text x="326" y="515" font-size="13" fill="#97a8bd" font-weight="400" text-anchor="start">if the result falls short</text>
<line x1="520" y1="492" x2="536" y2="472" stroke="#97a8bd" stroke-width="2" marker-end="url(#a)"/>
<rect x="538" y="440" width="206" height="64" rx="12" fill="#171c26" stroke="#263042" stroke-width="1.5"/>
<text x="552" y="466" font-size="16.5" fill="#e5ebf3" font-weight="600" text-anchor="start">Top model</text>
<text x="552" y="487" font-size="13" fill="#97a8bd" font-weight="400" text-anchor="start">does it itself, last resort</text>
<text x="86" y="594" font-size="13.5" fill="#5f6f86" font-weight="400" text-anchor="start">Top model plans and reviews. Target: 30–60% of work offloaded (a target, not a measured result).</text>
<rect x="820" y="420" width="720" height="190" rx="12" fill="#13171f" stroke="#263042" stroke-width="1.5"/>
<text x="846" y="452" font-size="13" fill="#fbbf24" font-weight="700" text-anchor="start" letter-spacing="2.5">WHO MAY DO WHAT</text>
<text x="846" y="484" font-size="15.5" fill="#e5ebf3" font-weight="600" text-anchor="start">Propose</text>
<text x="1020" y="484" font-size="15" fill="#97a8bd" font-weight="400" text-anchor="start">any agent</text>
<text x="846" y="509" font-size="15.5" fill="#e5ebf3" font-weight="600" text-anchor="start">Approve</text>
<text x="1020" y="509" font-size="15" fill="#97a8bd" font-weight="400" text-anchor="start">the human only</text>
<text x="846" y="534" font-size="15.5" fill="#e5ebf3" font-weight="600" text-anchor="start">Build</text>
<text x="1020" y="534" font-size="15" fill="#97a8bd" font-weight="400" text-anchor="start">the assigned builder</text>
<text x="846" y="559" font-size="15.5" fill="#e5ebf3" font-weight="600" text-anchor="start">Check</text>
<text x="1020" y="559" font-size="15" fill="#97a8bd" font-weight="400" text-anchor="start">a different agent, different vendor where possible</text>
<text x="846" y="584" font-size="15.5" fill="#e5ebf3" font-weight="600" text-anchor="start">Change the rules</text>
<text x="1020" y="584" font-size="15" fill="#97a8bd" font-weight="400" text-anchor="start">the human, in writing, with the reason</text>
<rect x="60" y="650" width="1480" height="190" rx="12" fill="#13171f" stroke="#263042" stroke-width="1.5"/>
<text x="86" y="682" font-size="13" fill="#4ade80" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTROL TOWER LAYERS</text>
<text x="1514" y="682" font-size="14" fill="#5f6f86" font-weight="400" text-anchor="end">built one layer at a time; each is used before the next begins</text>
