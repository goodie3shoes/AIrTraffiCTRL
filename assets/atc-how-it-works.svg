<rect width="1600" height="900" fill="#0e1013"/>
<text x="60" y="62" font-size="30" fill="#e5ebf3" font-weight="700" text-anchor="start">AI[r]TraffiCTRL™</text>
<text x="60" y="92" font-size="14" fill="#4ade80" font-weight="600" text-anchor="start" letter-spacing="3">FROM REQUEST TO RECORD</text>
<text x="1540" y="62" font-size="17" fill="#97a8bd" font-weight="400" text-anchor="end">Approval and independent review are separate steps, on purpose.</text>
<rect x="60.0" y="130" width="192.57142857142858" height="236" rx="12" fill="#13171f" stroke="#38bdf8" stroke-width="1.5"/>
<circle cx="90.0" cy="164" r="17" fill="none" stroke="#38bdf8" stroke-width="2"/>
<text x="90.0" y="170" font-size="17" fill="#38bdf8" font-weight="700" text-anchor="middle">1</text>
<text x="78.0" y="216" font-size="21" fill="#e5ebf3" font-weight="600" text-anchor="start">Request</text>
<text x="78.0" y="250.0" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">A sentence, typed</text>
<text x="78.0" y="269.575" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">or spoken.</text>
<line x1="255.57142857142858" y1="248.0" x2="271.57142857142856" y2="248.0" stroke="#97a8bd" stroke-width="2" marker-end="url(#a)"/>
<rect x="274.57142857142856" y="130" width="192.57142857142858" height="236" rx="12" fill="#13171f" stroke="#97a8bd" stroke-width="1.5"/>
<circle cx="304.57142857142856" cy="164" r="17" fill="none" stroke="#97a8bd" stroke-width="2"/>
<text x="304.57142857142856" y="170" font-size="17" fill="#97a8bd" font-weight="700" text-anchor="middle">2</text>
<text x="292.57142857142856" y="216" font-size="21" fill="#e5ebf3" font-weight="600" text-anchor="start">Preview</text>
<text x="292.57142857142856" y="250.0" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">The plan is shown.</text>
<text x="292.57142857142856" y="269.575" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">Nothing has</text>
<text x="292.57142857142856" y="289.15" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">changed yet.</text>
<line x1="470.1428571428571" y1="248.0" x2="486.1428571428571" y2="248.0" stroke="#97a8bd" stroke-width="2" marker-end="url(#a)"/>
<rect x="489.14285714285717" y="130" width="192.57142857142858" height="236" rx="12" fill="#13171f" stroke="#fbbf24" stroke-width="2"/>
<circle cx="519.1428571428571" cy="164" r="17" fill="none" stroke="#fbbf24" stroke-width="2"/>
<text x="519.1428571428571" y="170" font-size="17" fill="#fbbf24" font-weight="700" text-anchor="middle">3</text>
<text x="507.14285714285717" y="216" font-size="21" fill="#e5ebf3" font-weight="600" text-anchor="start">Human yes</text>
<text x="507.14285714285717" y="250.0" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">One explicit</text>
<text x="507.14285714285717" y="269.575" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">approval.</text>
<text x="507.14285714285717" y="289.15" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">No yes, no action.</text>
<line x1="684.7142857142858" y1="248.0" x2="700.7142857142858" y2="248.0" stroke="#97a8bd" stroke-width="2" marker-end="url(#a)"/>
<rect x="703.7142857142858" y="130" width="192.57142857142858" height="236" rx="12" fill="#13171f" stroke="#4ade80" stroke-width="1.5"/>
<circle cx="733.7142857142858" cy="164" r="17" fill="none" stroke="#4ade80" stroke-width="2"/>
<text x="733.7142857142858" y="170" font-size="17" fill="#4ade80" font-weight="700" text-anchor="middle">4</text>
<text x="721.7142857142858" y="216" font-size="21" fill="#e5ebf3" font-weight="600" text-anchor="start">Launch</text>
<text x="721.7142857142858" y="250.0" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">Folders, huddle</text>
<text x="721.7142857142858" y="269.575" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">room, code home,</text>
<text x="721.7142857142858" y="289.15" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">repo, registry —</text>
<text x="721.7142857142858" y="308.725" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">plus the briefing.</text>
<line x1="899.2857142857143" y1="248.0" x2="915.2857142857143" y2="248.0" stroke="#97a8bd" stroke-width="2" marker-end="url(#a)"/>
<rect x="918.2857142857143" y="130" width="192.57142857142858" height="236" rx="12" fill="#13171f" stroke="#38bdf8" stroke-width="1.5"/>
<circle cx="948.2857142857143" cy="164" r="17" fill="none" stroke="#38bdf8" stroke-width="2"/>
<text x="948.2857142857143" y="170" font-size="17" fill="#38bdf8" font-weight="700" text-anchor="middle">5</text>
<text x="936.2857142857143" y="216" font-size="21" fill="#e5ebf3" font-weight="600" text-anchor="start">Work</text>
<text x="936.2857142857143" y="250.0" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">Routed to the</text>
<text x="936.2857142857143" y="269.575" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">right agent and</text>
<text x="936.2857142857143" y="289.15" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">the cheapest tier</text>
<text x="936.2857142857143" y="308.725" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">that can do it.</text>
<line x1="1113.857142857143" y1="248.0" x2="1129.857142857143" y2="248.0" stroke="#97a8bd" stroke-width="2" marker-end="url(#a)"/>
<rect x="1132.857142857143" y="130" width="192.57142857142858" height="236" rx="12" fill="#13171f" stroke="#fbbf24" stroke-width="2"/>
<circle cx="1162.857142857143" cy="164" r="17" fill="none" stroke="#fbbf24" stroke-width="2"/>
<text x="1162.857142857143" y="170" font-size="17" fill="#fbbf24" font-weight="700" text-anchor="middle">6</text>
<text x="1150.857142857143" y="216" font-size="21" fill="#e5ebf3" font-weight="600" text-anchor="start">Independent</text>
<text x="1150.857142857143" y="242" font-size="21" fill="#e5ebf3" font-weight="600" text-anchor="start">check</text>
<text x="1150.857142857143" y="276.0" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">A different agent</text>
<text x="1150.857142857143" y="295.575" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">reviews.</text>
<text x="1150.857142857143" y="315.15" font-size="14.5" fill="#97a8bd" font-weight="400" text-anchor="start">Builder ≠ checker.</text>
<line x1="1328.4285714285716" y1="248.0" x2="1344.4285714285716" y2="248.0" stroke="#97a8bd" stroke-width="2" marker-end="url(#a)"/>
